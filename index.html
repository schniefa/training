<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBuddy</title>
<meta name="application-name" content="GymBuddy">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* One phone-width column; sticky header with tabs; workout view with a fixed dock (rest timer + save).
   Day colours follow competition plates: A = blue (20 kg), B = yellow (15 kg), C = green (10 kg); red (25 kg) is the action colour. */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --surface-2: #E2E7EC; --fg: #141A21; --muted: #5B6773; --line: #CBD3DB;
  --accent: #C42B2B; --accent-fg: #FFFFFF; --accent-soft: #F7DEDC;
  --dayA: #1F5FBF; --dayA-ink: #FFFFFF; --dayA-soft: #DCE6F7;
  --dayB: #E2B000; --dayB-ink: #1A1600; --dayB-soft: #FBF0C7;
  --dayC: #23824A; --dayC-ink: #FFFFFF; --dayC-soft: #D8EFE1;
  --dayX: #5B6773; --dayX-ink: #FFFFFF; --dayX-soft: #E2E7EC;
  --good: #1B7A42; --good-soft: #D6EFDF; --warn-soft: #FCEFCF;
  --shadow: 0 1px 2px rgba(20, 26, 33, .06), 0 4px 16px rgba(20, 26, 33, .06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1318; --surface: #171E26; --surface-2: #212A34; --fg: #E7ECF1; --muted: #93A0AD; --line: #2B3642;
    --accent: #E5484D; --accent-fg: #FFFFFF; --accent-soft: #3A1C1E;
    --dayA: #5B97F5; --dayA-ink: #08142A; --dayA-soft: #182740;
    --dayB: #F0C232; --dayB-ink: #1A1600; --dayB-soft: #352C10;
    --dayC: #4BBE78; --dayC-ink: #06190D; --dayC-soft: #143021;
    --dayX: #93A0AD; --dayX-ink: #0E1318; --dayX-soft: #212A34;
    --good: #55C985; --good-soft: #15301F; --warn-soft: #352C10;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
.sync { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; }
.sync.ok { color: var(--good); border-color: var(--good-soft); background: var(--good-soft); }
.sync.warn { background: var(--warn-soft); border-color: var(--warn-soft); }
.sync.err { background: var(--accent-soft); border-color: var(--accent-soft); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 1 auto; border: 0; background: none; padding: 8px 4px 10px; font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; white-space: nowrap; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main .wrap { padding-block: 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.note-line { font-size: 13px; color: var(--muted); margin: 0; }
.banner { background: var(--warn-soft); border-radius: var(--r); padding: 10px 12px; font-size: 14px; }

.week { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.week-num { grid-row: span 2; font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; }
.week-num span { font-size: 20px; color: var(--muted); font-weight: 600; }
.week-phase { font-family: var(--font-display); font-weight: 600; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; }
.week-hint { font-size: 14px; color: var(--muted); }
.week-bar { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
.week-bar span { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.week-bar i { height: 6px; border-radius: 2px; background: var(--surface-2); }
.week-bar span.deload i { background: var(--good-soft); }
.week-bar span i.done { background: var(--muted); opacity: .5; }
.week-bar span i.now { background: var(--accent); opacity: 1; }
.week-legend { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.nextcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 6px; border-left: 6px solid var(--muted); }
.nextcard.ready { border-left-color: var(--good); }
.nextcard.late, .nextcard.pause { border-left-color: var(--accent); }
.next-k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.next-h { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.nextcard.ready .next-h { color: var(--good); }
.nextcard p { margin: 0; font-size: 14px; }
.nextcard .row { margin-top: 4px; }
.win { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.win div { border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11px; line-height: 1.2; background: var(--surface-2); color: var(--muted); display: grid; gap: 2px; }
.win b { font-size: 14px; font-weight: 600; color: inherit; }
.win .w-ideal { background: var(--good); color: var(--surface); }
.win .w-ok { background: var(--good-soft); color: var(--good); }
.win .w-late { background: var(--accent-soft); color: var(--accent); }
.win .today { outline: 2px solid var(--fg); outline-offset: -2px; color: var(--fg); }
.win .w-ideal.today { color: var(--surface); }
.week-meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: 2px; }

.days { display: grid; gap: 12px; }
.day, .badge, .dsec { --c: var(--dayA); --ink: var(--dayA-ink); --soft: var(--dayA-soft); }
[data-day="B"] { --c: var(--dayB); --ink: var(--dayB-ink); --soft: var(--dayB-soft); }
[data-day="C"] { --c: var(--dayC); --ink: var(--dayC-ink); --soft: var(--dayC-soft); }
[data-day="X"] { --c: var(--dayX); --ink: var(--dayX-ink); --soft: var(--dayX-soft); }
.day { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px 14px 14px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 2px 14px; align-items: center; }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.plate { grid-row: span 3; width: 56px; height: 56px; border-radius: 50%; background: var(--c); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 30px; box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .22); }
.day .dh { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.day .sub { font-size: 14px; color: var(--muted); }
.day .names { grid-column: 2; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.day .go { font-family: var(--font-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.day.next { outline: 2px solid var(--c); outline-offset: -2px; }
.tag { display: inline-block; font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; background: var(--c); color: var(--ink); }

.resume { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.resume p { margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; min-height: 44px; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; background: var(--surface-2); text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 6px 2px; color: var(--accent); font-weight: 600; font-size: 14px; }
.inline-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }

.wtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wtop .wrap { padding-block: 10px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.back { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; }
.wtitle { min-width: 0; }
.wtitle h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.05; text-transform: uppercase; }
.wmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 500; min-height: 28px; }
.chipbtn input[type="date"] { border: 0; background: none; padding: 0; font-size: 13px; width: 8.6em; }
.badge { width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; flex: none; }

.workout .wrap { padding-block: 14px calc(190px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.phase-note { font-size: 14px; background: var(--surface); border-radius: var(--r); padding: 10px 12px; border-left: 4px solid var(--accent); }
.ex { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 12px 12px; display: grid; gap: 10px; }
.ex.complete { box-shadow: inset 0 0 0 2px var(--good); }
.ex-h { display: grid; grid-template-columns: auto auto 1fr auto; gap: 6px 8px; align-items: start; }
.grip { border: 0; background: none; width: 26px; height: 30px; margin-left: -6px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; padding: 0; -webkit-user-select: none; user-select: none; }
.grip svg { width: 12px; height: 20px; fill: currentColor; }
.reo-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); }
.reo-bar p { margin: 0; }
.reo { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reo li { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 12px 8px 8px; min-height: 52px; -webkit-user-select: none; user-select: none; }
.reo li .grip { margin-left: 0; width: 32px; height: 40px; }
.reo li.dragging { position: relative; z-index: 3; box-shadow: 0 10px 28px rgba(0, 0, 0, .25); outline: 2px solid var(--accent); }
.reo .rn { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reo .rc { color: var(--muted); font-size: 13px; }
.reo-top { display: flex; justify-content: flex-end; margin-bottom: -6px; }
.ex-n { font-family: var(--font-display); font-weight: 700; font-size: 20px; min-width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; padding: 0 4px; }
.ex-t { min-width: 0; }
.ex-t h3 { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.1; }
.exlink { text-decoration: none; }
.exlink span { font-size: 15px; color: var(--accent); margin-left: 2px; }
.ex-target { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.ex-count { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--muted); }
.ex.complete .ex-count { color: var(--good); }
.ex-last { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; color: var(--muted); }
.pill { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.pill.up { background: var(--good-soft); color: var(--good); }
.ss-note { font-size: 13px; color: var(--muted); }
.sets { display: grid; gap: 6px; }
.set, .set-head { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.set-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.set-head span:nth-child(2), .set-head span:nth-child(3) { text-align: center; }
.set-n { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--muted); text-align: center; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; background: var(--surface-2); border-radius: 10px; height: 46px; overflow: hidden; }
.step button { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); }
.step button:active { background: var(--line); }
.step input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; padding: 0; }
.step input::placeholder { color: var(--muted); opacity: .55; }
.tick { height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 22px; color: var(--muted); }
.set.done .tick { background: var(--good); border-color: var(--good); color: var(--surface); }
.set.done .step { background: var(--good-soft); }
.ex-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.rir { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.rir > span { margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); min-width: 36px; height: 32px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--fg); }
.chip.on { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.note { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.addex { background: var(--surface); border: 2px dashed var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.addex input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; font-size: 16px; }
.addex .row input { width: 4.5em; text-align: center; }
.sugg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.sugg { height: auto; min-height: 34px; padding: 6px 10px; font-weight: 500; text-align: left; }
.chip.pref { border-color: var(--good); color: var(--good); font-weight: 600; background: var(--good-soft); }
.lastx { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0, 0, 0, .08); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock .wrap { display: grid; gap: 10px; }
.timer { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
.timer-t { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 3.1ch; }
.timer-l { font-size: 12px; line-height: 1.25; color: var(--muted); min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.timer-ctl { display: flex; gap: 4px; }
.timer-ctl button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 36px; min-width: 44px; font-weight: 600; font-size: 14px; }
.timer-bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.timer-bar b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); opacity: .55; }
.timer.ready .timer-t { color: var(--good); }
.timer.ready .timer-bar i { background: var(--good); }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
.timer.over .timer-t { color: var(--good); }
.timer.over .timer-bar i { background: var(--good); }
.dock-row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.dock-row .btn { justify-content: center; }
.dock-count { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.dock-count small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast.lift { bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 10px; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.dsec { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.dsec > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--soft); }
.dsec > header h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; }
.prow { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 2px 12px; align-items: center; }
.prow:last-child { border-bottom: 0; }
.prow .pn { font-weight: 600; font-size: 15px; }
.prow .pv { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow .pv b { color: var(--good); font-weight: 600; }
.prow svg { grid-row: span 2; width: 96px; height: 32px; color: var(--c); }
.pdetail { padding: 0 16px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px 6px 0; }
td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
.hrow { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }

  if (vals.length < 2) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${vals.length ? `<circle cx="${W - P}" cy="${H / 2}" r="3" fill="currentColor"/>` : `<line x1="${P}" y1="${H / 2}" x2="${W - P}" y2="${H / 2}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="3 4"/>`}</svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), mx === mn ? H / 2 : H - P - (v - mn) / rg * (H - 2 * P)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" "), last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="${P},${H - P} ${line} ${W - P},${H - P}" fill="currentColor" fill-opacity=".14"/><polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}

    try {
      const t = AC.currentTime;
      [0, 0.28, 0.56].slice(0, count || 3).forEach(o => {
        const os = AC.createOscillator(), g = AC.createGain();
        os.frequency.value = 880; g.gain.setValueAtTime(0.0001, t + o);
        g.gain.exponentialRampToValueAtTime(0.25, t + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.2);
        os.connect(g).connect(AC.destination); os.start(t + o); os.stop(t + o + 0.22);

/* Pause als Spanne: ab der Untergrenze bereit (Signal), an der Obergrenze spätestens los (zweites Signal) */

  const now = Date.now();
  T.start = now; T.minAt = now + minSec * 1000; T.endAt = now + maxSec * 1000; T.label = label; T.f1 = T.f2 = false;
  ensureTick(); tickTimer();
}
function ensureTick() { if (!T.iv) T.iv = setInterval(tickTimer, 250); }
function stopTimer() { T.endAt = 0; T.f1 = T.f2 = false; if (T.iv) { clearInterval(T.iv); T.iv = null; } tickTimer(); }
function tickTimer() {
  const el = $("#timer"); if (!el) return;
  if (!T.endAt) { el.hidden = true; el.classList.remove("over", "ready"); return; }
  el.hidden = false;
  const now = Date.now(), toMin = T.minAt - now, toEnd = T.endAt - now, total = Math.max(1, T.endAt - T.start), span = T.endAt - T.minAt > 999;
  const fmt = ms => { const x = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(x / 60)}:${pad2(x % 60)}`; };
  let big, small, cls = "";
  if (toMin > 0) { big = fmt(toMin); small = `Pause · ${T.label}${span ? ` · danach noch bis zu ${fmt(T.endAt - T.minAt)}` : ""}`; }
  else if (toEnd > 0) { big = "Bereit"; small = `Los, wenn du bereit bist · spätestens in ${fmt(toEnd)}`; cls = "ready"; if (!T.f1) { T.f1 = true; beep(2); } }
  else {
    big = "Los!"; small = "Pause vorbei – nächster Satz"; cls = "over";
    if (!T.f2) { T.f2 = true; beep(span ? 3 : 2); setTimeout(() => { if (T.f2 && T.endAt && Date.now() - T.endAt > 5000) stopTimer(); }, 6000); }
  }
  $("#timer-t").textContent = big; $("#timer-l").textContent = small;
  $("#timer-bar").style.transform = `scaleX(${Math.max(0, toEnd) / total})`;
  const mk = $("#timer-mark"); if (mk) { mk.hidden = !span; mk.style.left = `${(T.minAt - T.start) / total * 100}%`; }
  el.classList.toggle("ready", cls === "ready"); el.classList.toggle("over", cls === "over");
}

/* Zusatzübung zum 3. Mal am selben Trainingstag -> fest in den Plan dieses Tages (einmalig, danach entscheidest du im Plan) */
function autoAddToPlan(day, exercises) {
  const planIds = new Set(planEx(day).map(e => e.id));
  const auto = (S.data.plan && S.data.plan.auto) || [];
  const added = [];
  let doc = null;
  for (const x of exercises) {
    if (planIds.has(x.id) || auto.includes(day + ":" + x.id)) continue;
    const hist = S.sessions.filter(s => s.day === day && (s.exercises || []).some(y => y.id === x.id));
    if (hist.length < 3) continue;
    if (!doc) { doc = { v: PLAN_V, auto: auto.slice() }; for (const k of DAY_KEYS) doc[k] = { ex: clone(planEx(k)) }; }
    const other = findPlanEx(x.id);

      const last3 = hist.slice(0, 3).map(s => s.exercises.find(y => y.id === x.id).sets);
      const reps = last3.flatMap(st => st.map(z => z.reps)), nSets = Math.max(...last3.map(st => st.length));

      const l = safeLink(info.link || ""); if (l) ex.link = l;

    const o = { id: e.id, name: String(e.name || "").trim() || "Neue Übung", sets: Math.round(n(e.sets, 3, 1, 10)), min, max, rest: Math.round(n(e.rest, 60, 0, 600)), restMax: 0, step: round2(n(e.step, 2.5, 0, 50)) };
    o.restMax = Math.max(o.rest, Math.round(n(e.restMax, o.rest, 0, 900)));
    if (e.bw) o.bw = true; if (e.ss) o.ss = true;
    const l = safeLink(e.link); if (l) o.link = l;
    return o;
  });
  return p;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  unlockAudio();
  switch (act) {
    case "tab": S.tab = v; S.confirm = null; render(); window.scrollTo(0, 0); return;
    case "sync-pill": syncFromTap(true); if (!CFG.googleClientId || !linked()) { S.tab = "plan"; render(); window.scrollTo(0, 0); } return;
    case "connect": case "sync-now": syncFromTap(true); return;
    case "unlink-yes":
      try { if (G.token && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(G.token, () => {}); } catch (e) {}
      G.token = null; ["tok", "linked", "fileId", "sheetHash"].forEach(LS.del); S.sync = { state: "off", at: null }; S.confirm = null; render(); toast("Verbindung getrennt"); return;
    case "confirm":
      S.confirm = v || null;
      if (S.view === "workout") { const r = $("#discard-row"); if (r) r.innerHTML = v ? confirmHTML("Dieses Training verwerfen?", "discard-yes", "Verwerfen") : `<button class="link" id="w-discard" data-act="confirm" data-v="discard-w">Training verwerfen</button>`; return; }
      render(); return;
    case "resume": openWorkout(); return;
    case "start":
      if (S.draft && S.draft.day === v && !S.draft.editingId) { openWorkout(); return; }
      if (S.draft) { S.confirm = "start-" + v; render(); return; }
      newDraft(v); openWorkout(); return;
    case "start-yes": discardDraft(); newDraft(v); openWorkout(); return;
    case "discard-yes": discardDraft(); stopTimer(); goHome(); toast("Training verworfen"); return;
    case "home": goHome(); return;
    case "save": finishWorkout(); syncFromTap(false); return;
    case "week": {
      const D = S.draft; D.week = D.week % 6 + 1;
      for (const e of draftList()) {
        const st = D.ex[e.id];
        if (e.extra || st.sets.some(x => x.done)) continue;
        const n = D.week === 6 ? Math.ceil(e.sets / 2) : e.sets;
        while (st.sets.length > n) st.sets.pop();
        while (st.sets.length < n) { const l = st.sets[st.sets.length - 1]; st.sets.push({ kg: l ? l.kg : null, reps: null, done: false, kgSet: false }); }
      }
      touch(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    case "t-15": { const now = Date.now(); T.minAt = Math.max(now, T.minAt - 15000); T.endAt = Math.max(T.minAt, T.endAt - 15000); tickTimer(); return; }
    case "t+15": { const now = Date.now(); if (now >= T.endAt) { T.endAt = now + 15000; T.minAt = T.endAt; T.start = now; T.f1 = T.f2 = false; } else { T.endAt += 15000; if (now < T.minAt) T.minAt += 15000; else T.f2 = false; } ensureTick(); tickTimer(); return; }
    case "tstop": stopTimer(); return;
    case "addex-open": S.addOpen = true; $("#addex-wrap").outerHTML = addExHTML(); setTimeout(() => { const i = $("#addex-name"); if (i) i.focus(); }, 0); return;
    case "addex-cancel": S.addOpen = false; $("#addex-wrap").outerHTML = addExHTML(); return;
    case "addex-ok": addExtra(); return;
    case "reo-start": S.reorder = true; render(); window.scrollTo(0, 0); return;
    case "reo-done": S.reorder = false; render(); window.scrollTo(0, 0); return;
    case "reo-reset": { const D = S.draft, planIds = planEx(D.day).map(e => e.id); D.order = planIds.concat(D.order.filter(id => !planIds.includes(id))); touch(); render(); return; }
    case "addex-quick": addExtraNamed(v, Math.min(10, Math.max(1, Number(b.dataset.n) || 3))); return;
    case "addex-pick": { const i = $("#addex-name"); if (i) { i.value = v; i.blur(); } const sg = $("#addex-sugg"); if (sg) sg.innerHTML = suggHTML(v); return; }
    case "prog": S.openProg = S.openProg === v ? null : v; render(); return;
    case "hist": S.openHist = S.openHist === v ? null : v; S.confirm = null; render(); return;
    case "edit": { const s = S.sessions.find(x => x.id === v); if (!s) return; if (S.draft) { toast("Erst das laufende Training speichern oder verwerfen."); return; } draftFromSession(s); openWorkout(); return; }
    case "del-yes": deleteSession(v); S.confirm = null; S.openHist = null; render(); toast("Einheit gelöscht"); syncFromTap(false); return;
    case "newblock-yes": { saveSettings(Object.assign({}, S.settings, { blockStart: todayISO() + new Date().toISOString(), shift: 0 })); S.confirm = null; render(); toast("Neuer Block: Das nächste Training ist Runde 1 · Einstieg"); syncFromTap(false); return; }
    case "pe-day": S.pe.day = v; S.confirm = null; render(); return;
    case "pe-up": case "pe-down": { const i = Number(b.closest(".pe-item").dataset.idx), L = S.pe.plan[S.pe.day].ex, j = act === "pe-up" ? i - 1 : i + 1; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; S.pe.dirty = true; render(); return; }
    case "pe-del": S.pe.plan[S.pe.day].ex.splice(Number(v), 1); S.pe.dirty = true; S.confirm = null; render(); return;
    case "pe-add": S.pe.plan[S.pe.day].ex.push({ id: "x" + Date.now().toString(36), name: "Neue Übung", sets: 3, min: 10, max: 12, rest: 60, restMax: 90, step: 2.5 }); S.pe.dirty = true; render(); setTimeout(() => { const ins = document.querySelectorAll('.pe-item input[data-pf="name"]'); const l = ins[ins.length - 1]; if (l) { l.focus(); l.select(); } }, 0); return;
    case "pe-revert": S.pe = null; render(); return;
    case "pe-save": { const p = sanitizePlan(clone(S.pe.plan)), doc = { v: PLAN_V, auto: ((S.data.plan && S.data.plan.auto) || []).slice() }; for (const k of DAY_KEYS) doc[k] = { ex: p[k].ex }; savePlanDoc(doc); S.pe = null; render(); toast("Plan gespeichert"); syncFromTap(false); return; }
    case "pe-reset": { const au = (S.data.plan && S.data.plan.auto) || []; S.data.plan = au.length ? { v: PLAN_V, auto: au } : null; } S.data.planAt = Date.now(); commit(); S.pe = null; S.confirm = null; render(); toast("Ursprünglicher Plan wiederhergestellt"); syncFromTap(false); return;
    case "import": $("#import-file").click(); return;
    case "export-csv": exportCSV(); return;
    case "export-json": downloadFile(`gymbuddy-sicherung-${todayISO()}.json`, JSON.stringify(S.data, null, 1), "application/json"); return;
  }
  const c = setCtx(b); if (!c) return;
  const { e, st, s, i, id } = c;
  const ent = lastEntry(S.sessions, id, S.draft.date, S.draft.editingId), rec = recommend(e, ent);
  if (act === "kg-" || act === "kg+") {
    const step = e.step > 0 ? e.step : 2.5;
    s.kg = Math.max(0, round2((s.kg || 0) + (act === "kg+" ? step : -step))); s.kgSet = true; propagate(st, i);
  } else if (act === "r-" || act === "r+") {
    if (s.reps == null) s.reps = repPlaceholder(e, ent, rec, i);
    else s.reps = Math.max(0, s.reps + (act === "r+" ? 1 : -1));
  } else if (act === "tick") {
    if (s.done) { s.done = false; s.reps = null; }
    else {
      if (s.reps == null) s.reps = repPlaceholder(e, ent, rec, i);
      if (s.kg == null) s.kg = 0;
      s.done = true; s.kgSet = true; propagate(st, i);
      if (e.rest > 0) startTimer(e.rest, e.restMax, e.name);
      else { const list = draftList(), nx = list[list.findIndex(x => x.id === id) + 1]; if (nx) toast(`Direkt weiter: ${nx.name}`); }
    }
  } else if (act === "rir") { const n = Number(v); st.rir = st.rir === n ? null : n; }
  else if (act === "addset") { const l = st.sets[st.sets.length - 1]; st.sets.push({ kg: l ? l.kg : null, reps: null, done: false, kgSet: false }); }
  else if (act === "rmex") {
    if (st.sets.some(x => x.done) && b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Wirklich entfernen?"; return; }
    S.draft.order = S.draft.order.filter(x => x !== id); delete S.draft.ex[id]; touch(); document.getElementById("ex-" + id).remove(); updateDock(); return;
  }
  else return;
  touch(); rerenderCard(id); updateDock();
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "addex-name") { const sg = $("#addex-sugg"); if (sg) sg.innerHTML = suggHTML(t.value); return; }
  if (t.dataset.f && S.view === "workout" && S.draft) {
    if (t.dataset.f === "date") { if (t.value) { S.draft.date = t.value; touch(); } return; }
    const c = setCtx(t); if (!c) return;
    if (t.dataset.f === "note") { c.st.note = t.value.slice(0, 300); touch(); return; }
    if (t.dataset.f === "kg") {
      c.s.kg = parseNum(t.value); c.s.kgSet = true; propagate(c.st, c.i);
      for (let j = c.i + 1; j < c.st.sets.length; j++) { const inp = document.getElementById(`kg-${c.id}-${j}`); if (inp && inp !== document.activeElement) inp.value = fmtKg(c.st.sets[j].kg); }
    }
    if (t.dataset.f === "reps") { const n = parseNum(t.value); c.s.reps = n == null ? null : Math.max(0, Math.round(n)); }
    touch(); return;
  }
  if (t.dataset.pf && S.tab === "plan") {
    const f = t.dataset.pf;
    if (f === "sound") { prefs.sound = t.checked; LS.set("prefs", prefs); return; }
    if (f === "blockstart") return;
    const item = t.closest(".pe-item"); if (!item) return;
    const e = S.pe.plan[S.pe.day].ex[Number(item.dataset.idx)];
    e[f] = (f === "bw" || f === "ss") ? t.checked : t.value;
    if (!S.pe.dirty) { S.pe.dirty = true; const sv = $("#pe-save"); if (sv) sv.disabled = false; }
    if (f === "ss") needsRender = true;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.xl) {
    const id = t.dataset.xl, l = t.value.trim();
    if (l && !safeLink(l)) { toast("Bitte eine Adresse mit https:// eingeben."); return; }
    const cur = extraInfo(id) || { name: id };
    S.data.extras[id] = { name: cur.name, link: l, at: Date.now() }; commit(); toast("Link gespeichert");
  }
  if (t.id === "import-file" && t.files && t.files[0]) {
    const f = t.files[0]; t.value = "";
    f.text().then(txt => {
      try { const n = importText(txt); render(); toast(n > 0 ? `${n} Einheiten importiert` : "Import fertig, keine neuen Einheiten"); }
      catch (e) { toast("Import fehlgeschlagen: " + (e.message || "unbekanntes Format")); }
    });
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "addex-name") { ev.preventDefault(); ev.target.blur(); } });

/* ---------- Drag and Drop: Reihenfolge nur für dieses Training (S.draft.order), der Plan bleibt unverändert ---------- */
const GRIP = '<svg viewBox="0 0 12 20" aria-hidden="true"><circle cx="3" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="9" cy="16" r="1.6"/></svg>';
const DR = { li: null, grab: 0, lastY: 0, raf: 0 };
function liCenter(li) { const r = li.getBoundingClientRect(); return r.top - (parseFloat(li.dataset.ty) || 0) + window.scrollY + r.height / 2; }
function beginDrag(id, clientY, fromCard) {
  if (!S.reorder) { S.reorder = true; render(); }
  const li = document.querySelector(`#reo li[data-id="${id}"]`); if (!li) return;
  if (fromCard) { const r = li.getBoundingClientRect(); window.scrollBy(0, r.top + r.height / 2 - clientY); }
  DR.li = li; DR.lastY = clientY;
  DR.grab = fromCard ? 0 : clientY + window.scrollY - liCenter(li);
  li.classList.add("dragging"); moveDrag(clientY); autoScroll();
}
function moveDrag(clientY) {
  const li = DR.li; if (!li) return;
  DR.lastY = clientY;
  const target = clientY + window.scrollY - DR.grab, gap = 6;
  let dy = target - liCenter(li);
  while (dy > 0 && li.nextElementSibling && dy >= (li.nextElementSibling.offsetHeight + gap) / 2) { li.parentNode.insertBefore(li.nextElementSibling, li); dy = target - liCenter(li); }
  while (dy < 0 && li.previousElementSibling && -dy >= (li.previousElementSibling.offsetHeight + gap) / 2) { li.parentNode.insertBefore(li, li.previousElementSibling); dy = target - liCenter(li); }
  if (!li.previousElementSibling) dy = Math.max(dy, -li.offsetHeight * 0.4);
  if (!li.nextElementSibling) dy = Math.min(dy, li.offsetHeight * 0.4);
  li.dataset.ty = dy; li.style.transform = `translateY(${dy}px)`;
}
function endDrag() {
  const li = DR.li; if (!li) return;
  DR.li = null; cancelAnimationFrame(DR.raf);
  li.classList.remove("dragging"); li.style.transform = ""; delete li.dataset.ty;
  const D = S.draft; if (!D) return;
  const order = [...document.querySelectorAll("#reo li")].map(x => x.dataset.id);
  if (order.join() !== draftList().map(e => e.id).join()) { D.order = order; touch(); }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function autoScroll() {
  cancelAnimationFrame(DR.raf);
  const step = () => {
    if (!DR.li) return;
    const top = ($(".wtop") ? $(".wtop").getBoundingClientRect().bottom : 0) + 50;
    const bottom = window.innerHeight - ($(".dock") ? $(".dock").offsetHeight : 0) - 50;
    const v = DR.lastY < top ? -10 : DR.lastY > bottom ? 10 : 0;
    if (v) { window.scrollBy(0, v); moveDrag(DR.lastY); }
    DR.raf = requestAnimationFrame(step);
  };
  DR.raf = requestAnimationFrame(step);
}
document.addEventListener("pointerdown", ev => {
  const g = ev.target.closest("[data-grip]");
  if (!g || S.view !== "workout" || !S.draft || (ev.pointerType === "mouse" && ev.button !== 0)) return;
  ev.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  beginDrag(g.dataset.grip, ev.clientY, !S.reorder);
});
window.addEventListener("pointermove", ev => { if (DR.li) { ev.preventDefault(); moveDrag(ev.clientY); } }, { passive: false });
window.addEventListener("pointerup", () => { if (DR.li) endDrag(); });
window.addEventListener("pointercancel", () => { if (DR.li) endDrag(); });

/* ---------- boot ---------- */
{ const mp = migratePlan(S.data.plan); if (mp) { S.data.plan = mp; S.data.planAt = Date.now(); LS.set("data", S.data); } }
derive();
render();
if (hasToken()) sync(); else setSync(linked() ? "auth" : "off");
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
